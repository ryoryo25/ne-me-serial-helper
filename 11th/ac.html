<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>11th『排他的ファイター』Type-A, C - シリアルまとめて入力</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="container">
    <h1>11th『排他的ファイター』Type-A, C - シリアルまとめて入力</h1>

    <form id="serial-form" class="form">
      <label>シリアルナンバー（複数行可）
        <textarea id="serial" rows="5" placeholder="1行に1つずつ入力してください"></textarea>
      </label>

      <fieldset>
        <legend>プレゼント番号</legend>
        <label><input type="radio" name="present" value="1" checked> 1</label>
        <label><input type="radio" name="present" value="2"> 2</label>
        <label><input type="radio" name="present" value="3"> 3</label>
      </fieldset>

      <label>メールアドレス
        <input id="email" type="email" autocomplete="email">
      </label>

      <label>氏名
        <input id="name" type="text" autocomplete="name">
      </label>

      <label>フリガナ
        <input id="name_kana" type="text" autocomplete="name">
      </label>

      <label>年齢
        <input id="age" type="number" min="0" max="150">
      </label>

      <fieldset>
        <legend>性別</legend>
        <label><input type="radio" name="gender" value="男" checked> 男</label>
        <label><input type="radio" name="gender" value="女"> 女</label>
      </fieldset>

      <div class="row">
        <label>郵便番号
          <div class="inline">
            <input id="zip1" maxlength="3" size="3" autocomplete="postal-code"> - <input id="zip2" maxlength="4" size="4" autocomplete="postal-code">
            <button type="button" id="zip-lookup">住所を自動入力</button>
          </div>
        </label>
      </div>

      <label>都道府県
        <input id="prefecture" type="text" disabled>
      </label>

      <label>住所（都道府県以降）
        <input id="address" type="text" autocomplete="street-address">
      </label>

      <div class="row">
        <label>電話番号
          <div class="inline">
            <input id="tel1" maxlength="5" size="5" autocomplete="tel"> - <input id="tel2" maxlength="4" size="4" autocomplete="tel"> - <input id="tel3" maxlength="4" size="4" autocomplete="tel">
          </div>
        </label>
      </div>

      <label><input id="agree" type="checkbox"> 注意事項に同意する</label>

      <div class="actions">
        <button type="button" id="preview">確認</button>
        <button type="reset">リセット</button>
      </div>

      <fieldset>
        <legend>curlスクリプト生成</legend>
        <label>送信先URL
          <input id="endpoint" type="url" value="https://krs.bz/kingrecords/m/d39ch9m" placeholder="https://example.com/submit">
        </label>
        <div class="actions">
          <button type="button" id="generate-curl">curlスクリプト作成</button>
          <button type="button" id="copy-curl" disabled>コピー</button>
        </div>
        <div id="copy-message" class="copy-message" aria-live="polite" style="margin-top: 0.25rem; font-size: 0.9rem; color: #2b6cb0;"></div>
        <label style="margin-top: 0.75rem;">生成されたシェルスクリプト
          <textarea id="curl-output" rows="10" readonly placeholder="「curlスクリプト作成」ボタンを押すとここに表示されます"></textarea>
        </label>
      </fieldset>
    </form>

    <p><a href="../">トップに戻る</a></p>
  </main>

  <!-- シングル固有設定 -->
  <script id="single-config" type="application/json">
  {
    "formNameMap": {
      "serial": "e_19870",
      "present": "e_19890",
      "email": "e_19877",
      "name": "e_19874",
      "name_kana": "e_19880",
      "age": "e_19876",
      "gender": "e_19889",
      "zip1": "e_19871[zip1]",
      "zip2": "e_19871[zip2]",
      "prefecture": "e_19872",
      "address": "e_19873",
      "tel1": "e_19875[tel1]",
      "tel2": "e_19875[tel2]",
      "tel3": "e_19875[tel3]",
      "agree": "e_19888[value][]"
    },
    "fixedValues": {
      "__search_e_19871": "",
      "f": "2744"
    },
    "defaultEndpoint": "https://krs.bz/kingrecords/m/d39ch9m"
  }
  </script>
  <script src="../assets/js/common.js"></script>
  <script defer src="../assets/js/form-engine.js"></script>
</body>
</html>
