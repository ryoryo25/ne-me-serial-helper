<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>12th『愛くださいませ/ここでファーストキッス』Type-B - シリアルまとめて入力</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="container">
    <h1>12th『愛くださいませ/ここでファーストキッス』Type-B - シリアルまとめて入力</h1>

    <form id="serial-form" class="form">
      <label>シリアルナンバー（複数行可）
        <textarea id="serial" rows="5" placeholder="1行に1つずつ入力してください"></textarea>
      </label>

      <label>ご希望のメンバー
        <select id="member">
          <option value="" selected>選択してください</option>
          <option value="1">尾木波菜</option>
          <option value="2">落合希来里</option>
          <option value="3">蟹沢萌子</option>
          <option value="4">河口夏音</option>
          <option value="5">川中子奈月心</option>
          <option value="6">櫻井もも</option>
          <option value="7">鈴木瞳美</option>
          <option value="8">谷崎早耶</option>
          <option value="9">冨田菜々風</option>
          <option value="10">永田詩央里</option>
          <option value="11">本田珠由記</option>
        </select>
      </label>

      <label>メールアドレス
        <input id="email" type="email" autocomplete="email">
      </label>

      <label>ニックネーム（10文字以内）
        <input id="nickname" type="text" maxlength="10">
      </label>

      <label>氏名
        <input id="name" type="text" autocomplete="name">
      </label>

      <label>フリガナ
        <input id="name_kana" type="text" autocomplete="name">
      </label>

      <label>年齢
        <input id="age" type="number" min="0" max="150">
      </label>

      <fieldset>
        <legend>性別</legend>
        <label><input type="radio" name="gender" value="男" checked> 男</label>
        <label><input type="radio" name="gender" value="女"> 女</label>
      </fieldset>

      <div class="row">
        <label>郵便番号
          <div class="inline">
            <input id="zip1" maxlength="3" size="3" autocomplete="postal-code1"> - <input id="zip2" maxlength="4" size="4" autocomplete="postal-code2">
            <button type="button" id="zip-lookup">住所を自動入力</button>
          </div>
        </label>
      </div>

      <label>都道府県
        <input id="prefecture" type="text" disabled>
      </label>

      <label>住所（都道府県以降）
        <input id="address" type="text" autocomplete="street-address">
      </label>

      <div class="row">
        <label>電話番号
          <div class="inline">
            <input id="tel1" maxlength="5" size="5" autocomplete="tel1"> - <input id="tel2" maxlength="4" size="4" autocomplete="tel2"> - <input id="tel3" maxlength="4" size="4" autocomplete="tel3">
          </div>
        </label>
      </div>

      <label><input id="agree" type="checkbox"> 注意事項に同意する</label>

      <div class="actions">
        <button type="button" id="preview">確認</button>
        <button type="reset">リセット</button>
      </div>

      <fieldset>
        <legend>curlスクリプト生成</legend>
        <label>送信先URL
          <input id="endpoint" type="url" value="https://krs.bz/kingrecords/m/s4m5f2t" placeholder="https://example.com/submit">
        </label>
        <div class="actions">
          <button type="button" id="generate-curl">curlスクリプト作成</button>
          <button type="button" id="copy-curl" disabled>コピー</button>
        </div>
        <div id="copy-message" class="copy-message" aria-live="polite" style="margin-top: 0.25rem; font-size: 0.9rem; color: #2b6cb0;"></div>
        <label style="margin-top: 0.75rem;">生成されたシェルスクリプト
          <textarea id="curl-output" rows="10" readonly placeholder="「curlスクリプト作成」ボタンを押すとここに表示されます"></textarea>
        </label>
      </fieldset>
    </form>

    <p><a href="../">トップに戻る</a></p>
  </main>

  <!-- シングル固有設定 -->
  <script id="single-config" type="application/json">
  {
    "formNameMap": {
      "serial": "e_23228",
      "member": "e_23237",
      "email": "e_23235",
      "nickname": "e_23240",
      "name": "e_23232",
      "name_kana": "e_23238",
      "age": "e_23234",
      "gender": "e_23247",
      "zip1": "e_23229[zip1]",
      "zip2": "e_23229[zip2]",
      "prefecture": "e_23230",
      "address": "e_23231",
      "tel1": "e_23233[tel1]",
      "tel2": "e_23233[tel2]",
      "tel3": "e_23233[tel3]",
      "agree": "e_23248[value][]"
    },
    "fixedValues": {
      "__search_e_23229": "",
      "e_23249": "",
      "e_23250": "",
      "f": "3136"
    },
    "defaultEndpoint": "https://krs.bz/kingrecords/m/s4m5f2t"
  }
  </script>
  <script src="../assets/js/common.js"></script>
  <script defer src="../assets/js/form-engine.js"></script>
</body>
</html>
